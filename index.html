<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RL Career Manager</title>
<style>
:root{--bg:#f3f5f9;--card:#fff;--tx:#121826;--mu:#667085;--ac:#ff6a00;--bl:#2563eb;--ok:#16a34a;--ko:#dc2626;--bd:#e3e7ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1220;--card:#151d30;--tx:#eef2fa;--mu:#8d99b3;--bd:#25304a}}
:root[data-theme="dark"]{--bg:#0c1220;--card:#151d30;--tx:#eef2fa;--mu:#8d99b3;--bd:#25304a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:12px}
h1{font-size:22px;margin:8px 0}h2{font-size:16px;margin:14px 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mu{color:var(--mu);font-size:13px}
button{font:inherit;border:0;border-radius:9px;padding:9px 12px;background:var(--bl);color:#fff;cursor:pointer}
button.o{background:var(--ac)}button.g{background:var(--bd);color:var(--tx)}button.r{background:var(--ko)}
button:disabled{opacity:.4}
input,select{font:inherit;padding:9px;border-radius:9px;border:1px solid var(--bd);background:var(--card);color:var(--tx);width:100%}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bar{height:7px;border-radius:4px;background:var(--bd);overflow:hidden;margin-top:4px}.bar i{display:block;height:100%}
nav{display:flex;gap:6px;margin:10px 0;overflow-x:auto}nav button{background:var(--card);color:var(--tx);border:1px solid var(--bd);white-space:nowrap}nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.top{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:6px 0;z-index:5}
.stat{font-weight:700}.ovr{font-size:20px;font-weight:800;color:var(--ac)}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.toast{background:var(--tx);color:var(--bg);padding:8px 12px;border-radius:9px;margin:8px 0}

:root{color-scheme:dark}body{background:#080b12!important;color:#e8ecf5!important;font-family:Inter,"Segoe UI",system-ui,sans-serif!important}h1,h2{letter-spacing:-.02em;font-weight:800}
.card,.tw{background:#111827!important;border:1px solid #1f2b44!important;border-radius:14px!important;color:#e8ecf5}.mu{color:#8b97b3!important}button{border-radius:10px!important;font-weight:600}button.on{background:linear-gradient(135deg,#ff7a1a,#ff3d71)!important;color:#fff!important}
select,input{background:#0c1220!important;color:#e8ecf5!important;border:1px solid #28365a!important;border-radius:8px!important}.rg{margin:18px 0;padding:14px;border:1px solid #1f2b44;border-radius:18px;background:linear-gradient(180deg,#0e1524,#0a0f1a)}.rg h2{margin:0 0 8px;color:#fff}.tn{margin:12px 0 6px;color:#ff9a4d;font-weight:700;font-size:13px;letter-spacing:.04em}
.tw{display:flex;gap:10px;padding:10px;margin:8px 0}.av2{min-width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff}.vf{display:inline-block;background:#1d9bf0;color:#fff;border-radius:50%;width:15px;height:15px;font-size:10px;text-align:center;line-height:15px;margin-left:3px}.tr{display:flex;gap:18px;margin-top:4px}
.otb{margin:6px 0;padding:8px;border-radius:10px;text-align:center;font-weight:800;color:#fff;background:linear-gradient(90deg,#ff3d71,#ff7a1a);animation:otp .8s infinite alternate}@keyframes otp{to{opacity:.55;transform:scale(1.02)}}@media(prefers-reduced-motion:reduce){.otb{animation:none}}
.relp{position:static}
.pop{position:absolute;right:0;top:34px;z-index:20;background:#0c1220;border:1px solid #28365a;border-radius:10px;padding:4px;display:flex;flex-direction:column;min-width:230px}.pop button{text-align:left;margin:2px}
main{max-width:none!important;padding:12px clamp(12px,3vw,40px)!important}
nav{display:flex!important;flex-wrap:wrap!important;overflow:visible!important;gap:6px;width:100%;margin:8px 0}nav button{flex:0 0 auto;padding:8px 14px!important;font-size:14px!important;border-radius:10px!important;white-space:nowrap;overflow:visible}nav button:not(.on):not(.r){background:#1e293b!important;border:1px solid #334155!important}nav button.r:not(.g):not(.on){background:#7f1d1d!important;border:1px solid #7f1d1d!important;display:inline-block!important}
@keyframes fxin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}#app.fx>*:not(nav){animation:fxin .35s ease both}@media(prefers-reduced-motion:reduce){#app.fx>*{animation:none!important}}
nav{position:relative;z-index:50}.pop{z-index:20}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
#app .card{padding:8px 12px!important;margin:6px 0!important;font-size:14px}#app .rg{padding:10px!important;margin:10px 0!important}#app .tw{padding:8px!important;margin:5px 0!important}
.acc{margin:10px 0}.acc>summary{cursor:pointer;font-weight:700;padding:10px 14px;border:1px solid #1f2b44;border-radius:10px;background:#111827;color:#e8ecf5}.acc[open]>summary{margin-bottom:8px}
.gold{background:linear-gradient(135deg,#f5d76e,#c9962b,#f7e08c)!important;color:#2a1c00!important;box-shadow:0 0 28px #f5b30166;border:1px solid #f5d76e!important}.gold h2,.gold div{color:#2a1c00}.ban{opacity:.75}.shk{animation:shk .45s}@keyframes shk{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}.ban .fm{color:#ef4444}
#app table{border-collapse:separate;border-spacing:0 6px}#app table td{padding:8px 12px}.lbh{align-items:center}
#sdr{line-height:1.4}#sdr h3{margin:0 0 10px}#sdr b{display:block!important;margin:22px 0 10px!important}#sdr div{margin-bottom:8px}#sdr label{display:flex!important;align-items:center;gap:12px;margin:12px 0!important}#sdr input[type=checkbox]{width:18px;height:18px;flex:none;margin:0}#sdr input[type=range]{margin:8px 0}#sdr button{margin:4px 8px 4px 0}#sdr hr{margin:24px 0;border:0;border-top:1px solid #28365a}#sdr>button{display:block;width:100%;margin:10px 0}
.fifa{background:#1a1208!important;border:2px solid #f5c542!important;box-shadow:0 0 22px #f59e0b44}
.fifa .fm{opacity:.65}
button.sub{background:#2563eb!important;border:1px solid #60a5fa!important;padding:12px 18px!important;border-radius:12px!important;transition:background .3s ease,box-shadow .3s ease,transform .15s ease,backdrop-filter .3s ease}button.sub:not(.g):not(.on):hover{background:linear-gradient(135deg,#FF6B35,#FF4081)!important;border-color:transparent!important;box-shadow:0 0 24px #ff6b3599;backdrop-filter:blur(6px);transform:translateY(-2px)}
</style></head><body><main id="app"></main>
<script>
const D=[["🇪🇺 Europe",[
["Vitality","#f2c200","zen:90|ExoTiiK:85|stizzy:86"],
["Karmine Corp","#2563eb","Vatira:89|Atow:88|Juicy:87"],
["Gentle Mates","#8b5cf6","archie:86|Oski:85|nass:85"],
["Man City Esports","#38bdf8","Seikoo:84|Ejby:82|accro:82"],
["Ninjas in Pyjamas","#ef4444","Joreuz:84|Oaly:82|crr:82"],
["Mate y Tapa","#f97316","ajg.:81|AtomiK:82|Dorito:80"],
["Geekay Esports","#10b981","Nyx:78|Kolt:77|Brio:76",1]]],
["🇸🇦 Arabie Saoudite / MENA",[
["Team Falcons","#16a34a","Rw9:89|Kiileerrz:90|dralii:89"],
["Twisted Minds","#a855f7","Nwpo:88|trk511:88|M0nkey M00n:88"],
["R8 Esports","#eab308","Abdullah:74|M7md:72|Ghaazi:76"]]],
["🇺🇸 Amérique du Nord",[
["NRG Esports","#fb7185","Atomic:88|BeastMode:86|Daniel:88"],
["Virtus.pro","#f59e0b","2Piece:86|Wahvey:85|Tawk:84"],
["Spacestation Gaming","#6366f1","zach:82|reveal:84|diaz:83"],
["Shopify Rebellion","#84cc16","firstkiller:85|Lj.:84|kofyr:82"],
["FUT Esports","#f43f5e","jstn:83|Chronic:83|Cheese:80"],
["Dignitas","#facc15","Vexa:77|Torq:76|Zeph:75",1]]],
["🌎 Amérique du Sud",[
["FURIA Esports","#9ca3af","yANXNZ:87|Lostt:85|swiftt:86"],
["MIBR","#dc2626","Reysbull:85|Aztromick:84|Sad:83"],
["Bigodes","#0ea5e9","Drufinho:78|nxghtt:79|Bemmz:77"],
["Energy Esports","#22d3ee","Kairo:76|Lumen:75|Tavo:74",1]]],
["🇦🇺 Océanie",[
["Wildcard","#e879f9","Torsos:82|Fever:80|bananahead:81"],
["PWR","#14b8a6","Rift:77|Quill:76|Dune:75",1]]],
["🌍 Afrique & Asie",[
["Five Fears","#64748b","Snowyy:80|TehQoz:78|gunz:77"],
["TSM","#a3a3a3","Catalysm:80|Kevin:76|Sphinx:75"]]]];
const T={},REG=D.map(([l,ts])=>[l,ts.map(([n,c,p,u])=>{const pl=p.split("|").map(x=>{const i=x.lastIndexOf(":");return[x.slice(0,i),+x.slice(i+1)]});const a=pl.reduce((s,q)=>s+q[1],0)/3;T[n]={c,p:pl,u,$:Math.round((25000+(a-70)*3500)/1000)*1000};return n})]);
const NM=["Rezo","Kuxir","Stalk","Nitro","Aztral","Joyo","Tiger","Tchoup","Wobble","Kaiser","Shiny","Vexor","Lynx","Drift","Blaze","Orion","Pixel","Sora"];
const TI=[{n:"Régionale",o:76,pr:15000},{n:"Cup",o:82,pr:30000},{n:"Major",o:87,pr:80000}];
const RQ=[
{q:"veut une augmentation de salaire.",a:["Accepter (+20 %)",(p,S)=>{p.s=Math.round(p.s*1.2);p.m+=15}],b:["Refuser",(p)=>{p.m-=15}]},
{q:"réclame un bootcamp pour progresser.",a:["Payer 3 000 €",(p,S)=>{S.money-=3000;p.m+=12;if(Math.random()<.6)p.o++}],b:["Refuser",(p)=>{p.m-=8}]},
{q:"veut changer de rôle sur le terrain.",a:["Accepter (-1 niveau)",(p)=>{p.m+=12;p.o--}],b:["Refuser",(p)=>{p.m-=10}]},
{q:"est en conflit avec un coéquipier.",a:["Médiation 1 000 €",(p,S)=>{S.money-=1000;p.m+=12}],b:["Ignorer",(p)=>{p.m-=14}]},
{q:"veut streamer plus souvent.",a:["Accepter (+500 € sponso)",(p,S)=>{S.money+=500;p.m+=8}],b:["Refuser",(p)=>{p.m-=6}]},
{q:"a reçu une offre d'une équipe rivale.",a:["Prime de fidélité 5 000 €",(p,S)=>{S.money-=5000;p.m+=22}],b:["Le laisser décider",(p)=>{p.m-=10}]}];
let S=null,tab="eq",toast="";
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const sal=o=>Math.max(100,Math.round((o-60)*25));
const mk=(n,o,m=60,y=0,v=0)=>({n,o,m,s:sal(o),y:y?1:0,v:v?1:0,pot:y?Math.min(92,o+5):o});
const E=n=>Math.round(n).toLocaleString("fr-FR")+" €";
const cl=v=>Math.max(0,Math.min(100,v));
const RS=["EU","MENA","NA","SAM","OCE","SSA/APAC"],rgOf=n=>REG.findIndex(r=>r[1].includes(n)),myRg=()=>Math.max(0,rgOf(S.team)),hs=n=>{let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))%997;return h},ageOf=p=>p.age||(p.age=p.y?17+hs(p.n)%4:p.v?27+hs(p.n)%4:20+hs(p.n)%7),sv=p=>Math.round((p.o-60)*900*.5/100)*100;
const eff=p=>p.o-(p.ad||0)+(p.f||0)-(p.m<55?Math.round((55-p.m)/4):0)+(p.m>80?1:0)+(p.v&&p.m>60?1:0)-(p.y&&p.m<50?1:0);
const rating=()=>{const e=S.roster.filter(p=>!p.ban&&!(p.age&&p.age<16)).map(eff).sort((a,b)=>b-a).slice(0,3);return e.length<3?0:e.reduce((a,b)=>a+b)/3+Math.max(-6,Math.min(4,coachB()+(S.form||0)-(S.coach&&S.coach.ad?S.coach.ad*.15:0)+(S.coach&&!S.coach.ad&&S.coach.rg!=null&&S.coach.rg!=myRg()?.5:0)+bcB()+(S.buff?S.buff.lv:0)))};
const save=()=>{try{localStorage.setItem("rlm",JSON.stringify(S))}catch(e){}};
const load=()=>{try{const s=localStorage.getItem("rlm");if(s){S=JSON.parse(s);if(S){S.sch=S.sch||[null,null,null,null,null];S.fam=S.fam||{};S.form=S.form||0;S.cm=S.cm||[]}}}catch(e){}};
function market(){const m=[];const used=new Set(S?S.roster.map(p=>p.n):[]);while(m.length<6){const n=NM[R(0,NM.length-1)]+(R(0,9)>6?R(1,99):"");if(used.has(n)||m.some(x=>x.n==n))continue;const o=R(68,86);m.push({...mk(n,o),fee:(o-60)*600})}return m}
function start(name,custom){
 const t=T[name];
 S={team:name,money:t?t.$:100000,week:1,rep:t?20:0,titles:0,log:[],inbox:[],roster:[],market:[],over:false};
 S.roster=t?t.p.map(([n,o])=>{const q=mk(n,o,65);q.rg=rgOf(name);return q}):[mk(NM[0],70),mk(NM[1],68),mk(NM[2],66)];
 S.market=market();S.log=["Bienvenue chez "+name+" ! Première saison."];tab="eq";save();draw()}
function sim(r,o){const p=1/(1+Math.exp(-(r-o)/5));let a=0,b=0;while(a<3&&b<3)Math.random()<p?a++:b++;return a==3}
function tournoi(){
 const t=TI[(S.week/4-1)%3],r=rating(),rn=["quarts","demies","finale"],pc=[.05,.2,.45,1];let k=0;
 for(;k<3;k++){if(!sim(r,t.o+R(-3,3)+(k==2?2:0)))break}
 const g=Math.round(t.pr*pc[k]);S.money+=g;
 const mo=k==3?6:k==2?2:k==1?-1:-4;S.roster.forEach(p=>p.m=cl(p.m+mo));
 S.rep+=k==3?8:k*2;if(k==3)S.titles++;
 S.log.unshift("🏆 "+t.n+" : "+(k==3?"VICTOIRE ! +":"éliminé en "+rn[k]+", +")+E(g));}
function advance(){
 if(S.over)return;
 if(S.roster.length<3){toast="Il te faut au moins 3 joueurs.";return draw()}
 toast="";
 const tw=S.week%4==0;if(tw)tournoi();
 const sa=S.roster.reduce((a,p)=>a+p.s,0),inc=1000+S.rep*15;
 S.money+=inc-sa;
 S.inbox.forEach(i=>{const p=S.roster.find(x=>x.n==i.pn);if(p)p.m-=3});
 S.roster.forEach(p=>{p.m=cl(p.m+(p.m>60?-1:1));if(p.m<30&&Math.random()<.5){p.o--;S.log.unshift("📉 "+p.n+" déprime : niveau -1")}});
 const out=S.roster.filter(p=>p.m<25&&Math.random()<.35);
 out.forEach(p=>{const g=(p.o-60)*900;S.money+=g;S.roster=S.roster.filter(x=>x!=p);S.inbox=S.inbox.filter(i=>i.pn!=p.n);
  S.log.unshift("🚪 "+p.n+" quitte l'équipe pour une autre structure ! Indemnité "+E(g))});
 if(S.roster.length&&Math.random()<.65){const p=S.roster[R(0,S.roster.length-1)];if(!S.inbox.some(i=>i.pn==p.n)){S.inbox.push({pn:p.n,k:R(0,RQ.length-1)})}}
 if(S.week%4==0)S.market=market();
 S.week++;
 if(S.money<-20000){S.over=true;S.log.unshift("💸 Faillite ! Fin de la carrière.")}
 S.log=S.log.slice(0,12);save();draw()}
function answer(i,c){const it=S.inbox[i],p=S.roster.find(x=>x.n==it.pn);if(p){RQ[it.k][c?"b":"a"][1](p,S);p.m=cl(p.m)}S.inbox.splice(i,1);save();draw()}
function sign(i){const p=S.market[i];if(S.roster.length>=4){toast="Effectif plein (4 max).";return draw()}if(S.money<p.fee){toast="Pas assez d'argent.";return draw()}
 S.money-=p.fee;S.fans=(S.fans||0)+Math.round(Math.max(0,p.o-70)*(S.fans||100)*.004);const{fee,...q}=p;S.roster.push(q);S.market.splice(i,1);toast="";save();draw()}
function sell(i){const p=S.roster[i];S.money+=sv(p);S.roster.splice(i,1);S.inbox=S.inbox.filter(x=>x.pn!=p.n);save();draw()}
function mc(m){return m>66?"var(--ok)":m>40?"var(--ac)":"var(--ko)"}
function draw(){
 const A=document.getElementById("app");
 if(!S){A.innerHTML=`<h1>🚀 RL Career Manager <span class="mu">v1.9</span></h1><p class="mu">Prends les rênes d'une équipe pro, gère l'argent, les transferts et l'humeur de tes joueurs. Rosters de fin de saison RLCS 2026 (après les Worlds). Les niveaux sont des estimations. Les équipes marquées ⚠️ n'ont pas de roster vérifié : leurs joueurs sont fictifs.</p>
 ${homeHTML()}
 <div class="card"><b>✨ Créer ma propre équipe</b><div class="mu">Catégorie 3 : 800 € de budget, 3 jeunes inconnus, pas de coach. Dur d'entrer dans l'e-sport !</div><input id="nm" placeholder="Nom de l'équipe" maxlength="20" style="margin:8px 0"><button class="o" onclick="start(document.getElementById('nm').value.trim()||'Mon Équipe')">Fonder</button></div>`+upBar();return}
 const tw=S.week%4==0,t=TI[(Math.ceil(S.week/4)-1)%3],nx=tw?S.week:S.week+(4-S.week%4),tn=TI[(nx/4-1)%3];
 let h=`<div class="top card row" style="border-left:6px solid ${S.color||'var(--ac)'}"><div><b>${S.logo?`<img src="${S.logo}" width="26" height="26" style="border-radius:6px;vertical-align:middle"> `:""}${S.dn||S.team}</b><div class="mu">Saison ${Math.ceil(S.week/52)} · Semaine ${S.week}</div></div><div style="text-align:right"><div class="stat" style="color:${S.money<0?"var(--ko)":"var(--ok)"}">${E(S.money)}</div><div class="mu">Niveau équipe ${rating().toFixed(1)} · 👥 ${fmt(S.fans||0)}</div></div></div>
 <nav>${[["eq","Équipe"],["ms","Messages"+((S.inbox.length+(S.iv?1:0))?" ("+(S.inbox.length+(S.iv?1:0))+")":"")],["co","Coach"],["bc","Bootcamp"],["bz","Business"],["pe","Perso"],["sc","Scrims"],["mk","Marché"],["tn","Compétitions"],["db","🔎 Clubs"],["sp","💳 Sponsors"],["ac","🏫 Académie"],...(S.ar||S.arl?[["ar","🏟️ Arène"]]:[]),["xf","𝕏 Fil"]].map(([k,l])=>`<button class="${tab==k?"on":""}" onclick="tab='${k}';toast='';draw()">${l}</button>`).join("")}<button class="r" onclick="rs()">${rc?"Sûr ? Appuie encore":"↩ Nouvelle partie"}</button></nav>`;
 if(toast)h+=`<div class="toast">${toast}</div>`;
 if(tab=="eq"){h+=ceoCard();
  h+=S.roster.map((p,i)=>`<div class="card"><div class="row"><div><b>${p.n}</b><div class="mu">${ageOf(p)} ans · région : ${RS[p.rg??myRg()]} · 🎯 ${styOf(p)[0]}${p.ad>0?" · ⚠️ adaptation -"+p.ad.toFixed(1):""} · Salaire ${E(p.s)}/sem · ${i<3?"Titulaire":"Remplaçant"}${p.y?" · 🌱 jeune (pot. "+p.pot+")":p.v?" · 🎖️ vétéran":""}</div></div><div class="ovr">${p.o}${fF(p)}</div></div><div class="mu">${p.ban?"🚫 Banni Epic "+p.ban+" sem · ":""}Moral ${Math.round(p.m)}${p.m<30?" ⚠️ risque de départ":""}</div><div class="bar"><i style="width:${p.m}%;background:${mc(p.m)}"></i></div><div class="btns"><button onclick="ngo(${i})">💬 Discuter</button> <button class="g" onclick="sell(${i})">Vendre (${E(sv(p))} · taxe 50 %)</button></div></div>`).join("");
  h+=`<h2>Journal</h2><div class="card mu">${S.log.map(l=>"<div>"+l+"</div>").join("")}</div>`}
